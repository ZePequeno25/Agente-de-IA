name: CI/CD Pipeline - Verificação e Segurança

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  security-scan:
    name: 🔒 Security & Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar segredos expostos
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Verificar arquivos sensíveis
        run: |
          echo "🔍 Verificando arquivos sensíveis..."
          
          # Lista de padrões que NÃO devem estar no repositório
          SENSITIVE_PATTERNS=(
            "*.pem"
            "*.key"
            "*.crt"
            ".env"
            "*.env.local"
            "credentials.json"
            "service-account.json"
            "*_secret*"
            "*_private*"
          )
          
          FOUND_SENSITIVE=0
          for pattern in "${SENSITIVE_PATTERNS[@]}"; do
            if find . -type f -name "$pattern" ! -path "./.git/*" | grep -q .; then
              echo "❌ Arquivo sensível encontrado: $pattern"
              FOUND_SENSITIVE=1
            fi
          done
          
          # Verificar logs de erro
          if [ -f "logs/errors.jsonl" ]; then
            echo "⚠️  Arquivo de logs de erro encontrado (deve estar no .gitignore)"
          fi
          
          if [ $FOUND_SENSITIVE -eq 1 ]; then
            echo "❌ Falha: Arquivos sensíveis detectados!"
            exit 1
          fi
          
          echo "✅ Nenhum arquivo sensível detectado"

      - name: Verificar .gitignore
        run: |
          echo "📋 Verificando se .gitignore cobre arquivos sensíveis..."
          REQUIRED_IGNORES=(
            "models/"
            "*.gguf"
            "logs/"
            "*.jsonl"
            ".env"
            "*.pem"
            "*.key"
          )
          
          for pattern in "${REQUIRED_IGNORES[@]}"; do
            if ! grep -q "^$pattern" .gitignore 2>/dev/null; then
              echo "⚠️  Padrão '$pattern' não está no .gitignore"
            fi
          done
          echo "✅ Verificação do .gitignore concluída"

  code-quality:
    name: 🧹 Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          # Verificar erros críticos
          flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Avisos
          flake8 scripts/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check formatting with black
        run: |
          black --check scripts/ || echo "⚠️  Formatação não está padrão (não crítico)"

  cross-platform-test:
    name: 🖥️ Cross-Platform Compatibility Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test system detector
        run: |
          python scripts/system_detector.py
        continue-on-error: true

      - name: Test error collector
        run: |
          python scripts/error_collector.py
        continue-on-error: true

      - name: Verify imports
        run: |
          python -c "import sys; print(f'Python {sys.version}')"
          python -c "from scripts import error_collector, system_detector; print('✅ Imports OK')"
        continue-on-error: true

  validate-configs:
    name: ⚙️ Validate Configuration Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate JSON configs
        run: |
          python -c "
          import json
          from pathlib import Path
          
          errors = []
          for config_file in Path('configs').glob('*.json'):
              try:
                  with open(config_file) as f:
                      json.load(f)
                  print(f'✅ {config_file} válido')
              except json.JSONDecodeError as e:
                  errors.append(f'{config_file}: {e}')
                  print(f'❌ {config_file} inválido: {e}')
          
          if errors:
              exit(1)
          "

      - name: Check preset structure
        run: |
          python -c "
          import json
          
          with open('configs/presets.json') as f:
              presets = json.load(f)
          
          required_fields = ['gpu_layers', 'quantization', 'context_size', 'threads']
          
          for preset_name, preset_config in presets.items():
              missing = [f for f in required_fields if f not in preset_config]
              if missing:
                  print(f'❌ Preset {preset_name} faltando campos: {missing}')
                  exit(1)
              print(f'✅ Preset {preset_name} válido')
          "

  documentation-check:
    name: 📚 Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check README exists
        run: |
          if [ ! -f README.md ]; then
            echo "❌ README.md não encontrado"
            exit 1
          fi
          echo "✅ README.md encontrado"

      - name: Check QUICKSTART exists
        run: |
          if [ ! -f QUICKSTART.md ]; then
            echo "❌ QUICKSTART.md não encontrado"
            exit 1
          fi
          echo "✅ QUICKSTART.md encontrado"

      - name: Validate markdown links
        run: |
          python -c "
          import re
          from pathlib import Path
          
          broken_links = []
          for md_file in Path('.').glob('*.md'):
              with open(md_file) as f:
                  content = f.read()
              
              # Find all relative links
              links = re.findall(r'\[([^\]]+)\]\(([^\)]+)\)', content)
              for text, link in links:
                  if not link.startswith('http') and not link.startswith('#'):
                      target = Path(md_file.parent) / link
                      if not target.exists() and not target.is_dir():
                          broken_links.append(f'{md_file}: {link}')
          
          if broken_links:
              print('❌ Links quebrados encontrados:')
              for link in broken_links:
                  print(f'  - {link}')
              exit(1)
          
          print('✅ Todos os links válidos')
          "

  build-summary:
    name: 📊 Build Summary
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, cross-platform-test, validate-configs, documentation-check]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 📊 Resumo da Verificação" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security Scan | ${{ jobs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧹 Code Quality | ${{ jobs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🖥️ Cross-Platform | ${{ jobs.cross-platform-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚙️ Config Validation | ${{ jobs.validate-configs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📚 Documentation | ${{ jobs.documentation-check.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ jobs.security-scan.result }}" == "failure" ]]; then
            echo "❌ **Falha crítica**: Problemas de segurança detectados!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
